<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>冀教版小学英语闪卡</title>
<style>
:root{
  --bg1:#0f1b2d; --bg2:#1b2f4e;
  --card:#fdf6ec; --card-edge:#e8dcc8;
  --ink:#24344d; --sub:#6b7a92;
  --acc:#ff7a3d; --acc-deep:#e85d1f;
  --gold:#d9a441;
  --ok:#2ecc71;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{max-width:100%;overflow-x:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(120% 90% at 15% 0%,var(--bg2) 0%,var(--bg1) 55%,#0a1522 100%);
  min-height:100vh;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px);
}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;flex:1;}

/* ---------- 头部 ---------- */
header{text-align:center;padding:14px 0 10px;}
header h1{
  font-size:19px;font-weight:800;letter-spacing:1px;color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.35);
}
header h1 .dot{color:var(--acc);}
header p{font-size:12px;color:#9fb2cc;margin-top:4px;}

/* ---------- 工具条 ---------- */
.toolbar{display:flex;gap:8px;align-items:center;margin:10px 0 8px;flex-wrap:nowrap;}
.btn{
  border:none;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.08);color:#dfe9f5;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  transition:transform .12s,background .15s;
}
.btn:active{transform:scale(.94);}
.btn.on{background:var(--acc);color:#fff;}
.spacer{flex:1;}
.icon-btn{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;}

/* 分类 chips 横向滚动 */
.chips{
  display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px;margin:0 -2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);
  color:#c8d6e8;border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;}

/* ---------- 卡片 ---------- */
.stage{display:flex;justify-content:center;perspective:1400px;margin:8px 0 4px;}
.card-scene{position:relative;width:100%;max-width:460px;height:min(52vh,430px);min-height:300px;transform-style:preserve-3d;}
.card{
  position:absolute;inset:0;border-radius:26px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.1,.2,1);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 18px 45px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06) inset;
}
.card.flip{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;border-radius:26px;padding:22px;
  display:flex;flex-direction:column;
  background:linear-gradient(165deg,#fffdf7 0%,var(--card) 55%,#f3e8d2 100%);
  border:1px solid var(--card-edge);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.face.back{transform:rotateY(180deg);background:linear-gradient(165deg,#fffaf0 0%,#fdf0da 60%,#f7e3c4 100%);}

.face .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.tag{
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;
  background:rgba(26,74,135,.09);color:#3a5a86;letter-spacing:.3px;
}
.tag.acc{background:rgba(255,122,61,.14);color:var(--acc-deep);}

.face .main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;}
.card-img{
  flex:none;width:min(62%,240px);aspect-ratio:1/1;margin:2px auto 12px;
  display:flex;align-items:center;justify-content:center;
  border-radius:18px;background:linear-gradient(160deg,#fff 0%,#f1e7d3 100%);
  border:1px solid rgba(217,164,65,.35);overflow:hidden;
}
.card-img img{
  width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(1.3);
  transform-origin:center;
}
.card-img.hide{display:none;}
.watermark{
  text-align:center;font-size:8.5px;line-height:1.5;letter-spacing:.5px;
  color:rgba(90,70,35,.20);margin:2px 0 6px;user-select:none;
}
.watermark.hide{display:none;}
.face .l3en,.face .l3zh{font-weight:800;word-break:break-word;line-height:1.3;}
.face .l3en{font-size:clamp(24px,6vw,34px);color:var(--ink);}
.face .l3zh{font-size:clamp(30px,7.5vw,44px);color:var(--ink);}
.face .hint{font-size:12px;color:var(--sub);margin-top:12px;}

.path{
  margin-top:auto;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.65);
  border:1px dashed rgba(217,164,65,.55);text-align:center;
}
.path .pl{font-size:12px;color:var(--sub);margin-bottom:4px;letter-spacing:1px;}
.path .pv{font-size:15px;font-weight:700;color:#5a4a20;line-height:1.5;word-break:break-word;}
.path .pv .arrow{color:var(--gold);margin:0 5px;font-weight:900;}

.face:not(.back) .path{display:none;}
.speaker{
  position:absolute;bottom:14px;right:14px;z-index:5;
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  background:var(--acc);color:#fff;font-size:19px;
  box-shadow:0 6px 16px rgba(232,93,31,.45);
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s;
}
.speaker:active{transform:scale(.9);}
.speaker.speaking{animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,61,.55);}50%{box-shadow:0 0 0 14px rgba(255,122,61,0);}}

.corner{
  position:absolute;top:14px;left:16px;font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:.5px;
}

/* ---------- 进度 ---------- */
.progress{margin:14px 0 4px;}
.progress .pbar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;}
.progress .pfill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width .25s;width:0;}
.progress .ptext{display:flex;justify-content:space-between;font-size:11.5px;color:#9fb2cc;margin-top:6px;}

/* ---------- 底部操作 ---------- */
.controls{display:flex;align-items:center;gap:10px;margin-top:10px;}
.ctrl-btn{
  flex:1;border:none;border-radius:16px;padding:14px 0;font-size:15px;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.1);color:#eaf1fa;transition:transform .12s,background .15s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.ctrl-btn:active{transform:scale(.95);}
.ctrl-btn.primary{background:linear-gradient(135deg,var(--acc) 0%,var(--acc-deep) 100%);box-shadow:0 8px 20px rgba(232,93,31,.35);}
.ctrl-btn.small{flex:0 0 auto;width:52px;border-radius:16px;}
#langBtn{font-size:12px;font-weight:800;letter-spacing:.5px;}

/* ---------- 提示条 ---------- */
.toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
  background:rgba(20,32,52,.95);color:#fff;padding:10px 18px;border-radius:12px;
  font-size:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:99;
  box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:86%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

footer{text-align:center;font-size:11px;color:#5f7290;margin-top:14px;letter-spacing:.5px;}
.tts-banner{
  display:flex;align-items:flex-start;gap:8px;margin:8px 0 4px;padding:10px 12px;
  background:linear-gradient(135deg,#fff7e6 0%,#ffefd2 100%);
  border:1px solid rgba(217,164,65,.5);border-radius:12px;
  font-size:12.5px;line-height:1.6;color:#6b5310;
}
.tts-banner.hide{display:none;}
.tts-banner b{color:#a05a00;}
.tts-banner .x{margin-left:auto;flex:none;background:none;border:none;font-size:14px;color:#a08a55;cursor:pointer;padding:0 2px;}
</style>
</head>

  <header>
    <h1>冀教版小学英语<span class="dot">闪卡</span></h1>
    <p id="statLine">三年级起点 · 3-6 年级 · 716 个单词</p>

  <div class="chips" id="chips"></div>

  <div class="stage">

          <div class="path"><div class="pl">所属路径</div><div class="pv" id="backPath"></div></div>
        </div>
        <button class="speaker" id="speakBtn" aria-label="朗读">🔊</button>
      </div>
    </div>
  </div>

  <div class="watermark hide" id="watermark"><div>微信/电话：13513443496</div><div>做出口找小詹 · 让外贸更简单</div></div>

  <div class="progress">
    <div class="pbar"><div class="pfill" id="pfill"></div></div>
    <div class="ptext"><span id="pcur">0 / 0</span><span id="pinfo"></span></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn small" id="prevBtn">◀</button>
    <button class="ctrl-btn primary" id="nextBtn">下一张 ▶</button>
    <button class="ctrl-btn small" id="langBtn" title="中英文图片转换">中⇄EN</button>
  </div>

  <footer>数据：冀教版小学英语（三年级起点）3-6 年级单词表· 点 🔊 逐词跟读 · 点击卡片翻面 · 右下角按钮中英文图片转换</footer>
</div>

var elFrontImgWrap=$("frontImgWrap"), elFrontImg=$("frontImg"), elWatermark=$("watermark");

var elChips=$("chips"), elModeBtn=$("modeBtn"), elOrderBtn=$("orderBtn"), elAutoBtn=$("autoBtn");
var elSpeak=$("speakBtn"), elPrev=$("prevBtn"), elNext=$("nextBtn"), elLang=$("langBtn");
var elToast=$("toast");

/* ---------- 语音 ---------- */
var voices=[];
var SPEAK_GAP = 1000;   // 单词间隔 1 秒
var speakGen = 0;       // 朗读代次，用于中断旧朗读链
function loadVoices(){
  voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
}

  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(lang){
  var exact = lang.toLowerCase();
  var preferred = {
    "en-gb": ["daniel", "kate", "arthur", "serena", "oliver", "moira", "libby", "sonia", "thomas", "google uk english"],
    "en-us": ["google us english", "samantha", "alex", "ava", "allison"],
    "zh-cn": ["ting-ting", "xiaoxiao", "huihui", "meijia", "yaoyao", "google 普通话"]
  };
  var list = preferred[exact] || [];
  for (var i=0;i<list.length;i++){
    for (var j=0;j<voices.length;j++){
      if (voices[j].name && voices[j].name.toLowerCase().indexOf(list[i])!==-1) return voices[j];
    }
  }
  for (var j=0;j<voices.length;j++){
    if (voices[j].lang && voices[j].lang.toLowerCase().indexOf(exact)===0) return voices[j];
  }
  var p = lang.split("-")[0];
  for (var j=0;j<voices.length;j++){
    if (voices[j].lang && voices[j].lang.toLowerCase().indexOf(p)===0) return voices[j];
  }
  return null;
}

  speakGen++;
  if ("speechSynthesis" in window) speechSynthesis.cancel();

function speakByGroups(groups, lang, onDone){

    next();
  }
  function next(){
    if (gen !== speakGen) return;
    if (i >= groups.length){
      elSpeak.classList.remove("speaking");
      if (onDone) onDone();
      return;

    var g = groups[i++];
    var u = new SpeechSynthesisUtterance(g);
    u.lang = lang;
    u.rate = 0.9;
    u.pitch = 1;
    var v = pickVoice(lang);

      if (i < groups.length){

  }

  };
  audioEl.src = url;
  setTimeout(function(){
    if (!finished && audioEl.readyState < 3){ done(false); }
  }, 4000);
}
function speakCurrent(onDone){
  var r = ALL[state.deck[state.idx]];
  if (!r) return;
  var idx = state.deck[state.idx];
  var isEn;
  if (state.flipped){
    isEn = state.mode !== "en2zh";
  } else {
    isEn = state.mode === "en2zh";
  }
  if (!isEn){
    if (state.flipped){ speakText(r.l1zh+"，"+r.l2zh+"，"+r.l3zh, "zh-CN", onDone); }
    else { speakText(r.l3zh, "zh-CN", onDone); }
    return;
  }
  /* 英文：优先播放预生成音频（微信内也可发声），失败回退 TTS */
  stopSpeaking();
  var url = "audio/" + pad5(idx) + ".m4a";
  playAudio(url, function(){ if (onDone) onDone(); }, function(){
    if (state.flipped){ speakByGroups(splitGroups(r.l1en+" "+r.l2en+" "+r.l3en), "en-GB", onDone); }
    else { speakByGroups(splitGroups(r.l3en), "en-GB", onDone); }
  });
}

/* ---------- 筛选 chips ---------- */
function buildChips(){
  var cats = [];
  var seen = {};
  for (var i=0;i<ALL.length;i++){
    var k = ALL[i].l2zh;
    if (!seen[k]){ seen[k]=true; cats.push({zh:k, en:ALL[i].l2en, n:1}); }
    else { for (var j=0;j<cats.length;j++) if (cats[j].zh===k) cats[j].n++; }
  }
  var html = '<div class="chip on" data-cat="all">全部 <b>'+ALL.length+'</b></div>';
  for (var c=0;c<cats.length;c++){
    html += '<div class="chip" data-cat="'+cats[c].zh+'">'+cats[c].zh+' <b>'+cats[c].n+'</b></div>';
  }
  elChips.innerHTML = html;
  elChips.addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if (!chip) return;
    var cat = chip.getAttribute("data-cat");
    if (cat === state.cat) return;
    state.cat = cat;
    var all = elChips.querySelectorAll(".chip");
    for (var i=0;i<all.length;i++) all[i].classList.remove("on");
    chip.classList.add("on");
    buildDeck();
  });
}

/* ---------- deck ---------- */
function buildDeck(){
  stopSpeaking();
  state.deck = [];
  for (var i=0;i<ALL.length;i++){
    if (state.cat==="all" || ALL[i].l2zh===state.cat) state.deck.push(i);
  }
  if (state.order==="rand") shuffle(state.deck);
  state.idx = 0;
  state.flipped = false;
  elCard.classList.remove("flip");
  render();
}
function shuffle(a){
  for (var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
}
function nextIdx(){
  if (state.order==="rand") return Math.floor(Math.random()*state.deck.length);
  return (state.idx+1)%state.deck.length;
}

/* ---------- render ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function render(){
  if (!state.deck.length){ toast("当前分类无数据"); return; }
  var r = ALL[state.deck[state.idx]];
  var en2zh = state.mode==="en2zh";

  elFrontText.textContent = en2zh ? r.l3en : r.l3zh;
  elBackText.textContent  = en2zh ? r.l3zh : r.l3en;
  elFrontPath.innerHTML = en2zh
    ? esc(r.l1en)+'<span class="arrow">›</span>'+esc(r.l2en)
    : esc(r.l1zh)+'<span class="arrow">›</span>'+esc(r.l2zh);
  elBackPath.innerHTML = en2zh
    ? esc(r.l1zh)+'<span class="arrow">›</span>'+esc(r.l2zh)+'<span class="arrow">›</span>'+esc(r.l3zh)
    : esc(r.l1en)+'<span class="arrow">›</span>'+esc(r.l2en)+'<span class="arrow">›</span>'+esc(r.l3en);

  elTagsFront.innerHTML = en2zh
    ? '<span class="tag">'+esc(r.l1en)+'</span><span class="tag">'+esc(r.l2en)+'</span>'
    : '<span class="tag">'+esc(r.l1zh)+'</span><span class="tag">'+esc(r.l2zh)+'</span>';
  elTagsBack.innerHTML  = '<span class="tag acc">'+esc(r.l3en)+'</span>';
  elCornerFront.textContent = en2zh ? "英 → 中" : "中 → 英";
  updateLangBtn();
  if (r.img){
    elFrontImgWrap.classList.remove("hide");
    elFrontImg.src = r.img;
  } else {
    elFrontImgWrap.classList.add("hide");
    elFrontImg.removeAttribute("src");
  }
  if (r.img){
    elWatermark.classList.remove("hide");
  } else {
    elWatermark.classList.add("hide");
  }
  elFrontHint.textContent = en2zh ? "Tap to flip · 🔊 word by word" : "点击卡片查看英文 · 点 🔊 逐词跟读";
  elFrontPathLabel.textContent = en2zh ? "PATH" : "所属路径";

  var n = state.deck.length;
  var pct = n ? Math.round((state.idx+1)/n*100) : 0;
  elPfill.style.width = pct+"%";
  elPcur.textContent = (state.idx+1)+" / "+n;
  elPinfo.textContent = state.cat==="all" ? "全部" : state.cat;
}
function flipCard(){
  state.flipped = !state.flipped;
  elCard.classList.toggle("flip", state.flipped);
  if (state.autoOn){ scheduleAuto(); }
}

/* ---------- 自动播放（朗读驱动） ---------- */
function stopAuto(){
  state.autoOn = false;
  elAutoBtn.textContent = "▶";
  elAutoBtn.classList.remove("on");
  if (state.autoTimer){ clearTimeout(state.autoTimer); state.autoTimer=null; }
  stopSpeaking();
}
function scheduleAuto(){
  if (!state.autoOn) return;
  if (state.autoTimer) clearTimeout(state.autoTimer);
  if (state.flipped){
    // 背面阶段：朗读答案，2.6s 后下一张
    speakCurrent(function(){});
    state.autoTimer = setTimeout(function(){
      elCard.classList.remove("flip");
      state.flipped = false;
      state.idx = nextIdx();
      render();
      scheduleAuto();
    }, 2600);
  } else {
    // 正面阶段：逐词朗读英文（3s 间隔），完成后 1.2s 翻面
    speakCurrent(function(){
      if (!state.autoOn) return;
      state.autoTimer = setTimeout(function(){
        elCard.classList.add("flip");
        state.flipped = true;
        scheduleAuto();
      }, 1200);
    });
  }
}
function toggleAuto(){
  state.autoOn = !state.autoOn;
  if (state.autoOn){
    elAutoBtn.textContent = "⏸";
    elAutoBtn.classList.add("on");
    if (state.flipped){ elCard.classList.remove("flip"); state.flipped=false; }
    scheduleAuto();
    toast("自动播放中：自动翻面并朗读");
  } else {
    stopAuto();
  }
}

/* ---------- 事件 ---------- */
elCard.addEventListener("click", function(e){
  if (e.target === elSpeak || elSpeak.contains(e.target)) return;
  stopSpeaking();
  flipCard();
});
elSpeak.addEventListener("click", function(e){
  e.stopPropagation();
  if (state.autoOn) return;
  speakCurrent();
});
elNext.addEventListener("click", function(){
  stopSpeaking();
  state.idx = nextIdx();
  state.flipped = false;
  elCard.classList.remove("flip");
  render();
  if (state.autoOn) scheduleAuto();
});
elPrev.addEventListener("click", function(){
  stopSpeaking();
  state.idx = (state.idx-1+state.deck.length)%state.deck.length;
  state.flipped = false;
  elCard.classList.remove("flip");
  render();
  if (state.autoOn) scheduleAuto();
});
elLang.addEventListener("click", function(){
  stopSpeaking();
  state.mode = state.mode === "en2zh" ? "zh2en" : "en2zh";
  elModeBtn.textContent = state.mode === "en2zh" ? "EN → 中" : "中 → EN";
  if (state.flipped){ elCard.classList.remove("flip"); state.flipped = false; }
  render();
});
function updateLangBtn(){
  elLang.title = state.mode === "en2zh" ? "切换为中文+图片（当前英文）" : "切换为英文+图片（当前中文）";
}
elModeBtn.addEventListener("click", function(){
  stopSpeaking();
  state.mode = state.mode==="en2zh" ? "zh2en" : "en2zh";
  elModeBtn.textContent = state.mode==="en2zh" ? "EN → 中" : "中 → EN";
  if (state.flipped){ elCard.classList.remove("flip"); state.flipped=false; }
  render();
});
elFrontImg.addEventListener("error", function(){ elFrontImgWrap.classList.add("hide"); });
elFrontImg.addEventListener("load", function(){ elFrontImgWrap.classList.remove("hide"); });
elOrderBtn.addEventListener("click", function(){
  stopSpeaking();
  state.order = state.order==="seq" ? "rand" : "seq";
  elOrderBtn.textContent = state.order==="seq" ? "顺序" : "随机";
  buildDeck();
});
elAutoBtn.addEventListener("click", toggleAuto);

var elTtsBanner=$("ttsBanner"), elTtsClose=$("ttsClose");
function checkTTS(){
  if (!("speechSynthesis" in window)){
    elTtsBanner.classList.remove("hide");
  }
}
elTtsClose.addEventListener("click", function(){ elTtsBanner.classList.add("hide"); });

document.addEventListener("visibilitychange", function(){
  if (document.hidden) stopSpeaking();
});

/* 键盘支持（桌面） */
document.addEventListener("keydown", function(e){
  if (e.key==="ArrowRight" || e.key===" ") elNext.click();
  else if (e.key==="ArrowLeft") elPrev.click();
  else if (e.key==="Enter") flipCard();
});

/* ---------- toast ---------- */
var toastTimer=null;
function toast(msg){
  elToast.textContent = msg;
  elToast.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ elToast.classList.remove("show"); }, 2200);
}

/* ---------- 启动 ---------- */
buildChips();
buildDeck();
checkTTS();
})();
</script>
</body>
</html>
